<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SKYSENSE – Flight Price Predictor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:       #185FA5;
      --blue-dark:  #0C447C;
      --blue-light: #E6F1FB;
      --text:       #1a1a2e;
      --muted:      #6b7280;
      --border:     #d1d9e6;
      --bg:         #f0f4f9;
      --white:      #ffffff;
      --red:        #dc2626;
      --red-bg:     #fef2f2;
      --radius:     12px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Nav ── */
    nav {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      height: 60px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .nav-logo { font-size: 22px; font-weight: 700; color: var(--blue); letter-spacing: 1px; }
    .nav-tag  { font-size: 12px; color: var(--muted); margin-left: 4px; }

    /* ── Hero ── */
    .hero {
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue-dark) 100%);
      color: var(--white);
      text-align: center;
      padding: 3rem 1rem 5rem;
    }
    .hero h1 { font-size: 2.2rem; font-weight: 700; margin-bottom: 0.5rem; }
    .hero p  { font-size: 1rem; opacity: 0.85; }

    /* ── Card ── */
    .container { max-width: 780px; margin: -3rem auto 3rem; padding: 0 1rem; }

    .card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      padding: 2rem;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    /* ── Grid ── */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.2rem; }

    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: 13px; font-weight: 500; color: var(--muted); }
    .field select,
    .field input {
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      color: var(--text);
      background: var(--white);
      transition: border-color .15s;
      width: 100%;
    }
    .field select:focus,
    .field input:focus { outline: none; border-color: var(--blue); }

    /* ── Stops buttons ── */
    .stops-group { display: flex; gap: 8px; }
    .stop-btn {
      flex: 1;
      padding: 10px 6px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      background: var(--white);
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
      transition: all .15s;
      text-align: center;
    }
    .stop-btn:hover  { border-color: var(--blue); color: var(--blue); }
    .stop-btn.active { background: var(--blue-light); border-color: var(--blue); color: var(--blue); font-weight: 600; }

    /* ── Divider ── */
    .divider { height: 1px; background: var(--border); margin: 1.5rem 0; }

    /* ── Submit ── */
    .btn-predict {
      width: 100%;
      padding: 14px;
      background: var(--blue);
      color: var(--white);
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-predict:hover { background: var(--blue-dark); }

    /* ── Error ── */
    .error-box {
      background: var(--red-bg);
      border: 1px solid #fca5a5;
      color: var(--red);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 14px;
      margin-bottom: 1.5rem;
    }

    /* ── Responsive ── */
    @media (max-width: 580px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .hero h1 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

<nav>
  <span class="nav-logo">✈ SKYSENSE</span>
  <span class="nav-tag">Flight Price Prediction</span>
</nav>

<div class="hero">
  <h1>Predict Your Flight Price</h1>
  <p>Powered by Random Forest Machine Learning &mdash; enter your travel details below</p>
</div>

<div class="container">
  <div class="card">

    {% if error %}
    <div class="error-box">⚠ {{ error }}</div>
    {% endif %}

    <form action="/predict" method="POST">

      <!-- Route -->
      <div class="section-title">Route</div>
      <div class="grid-3" style="margin-bottom:1.2rem">
        <div class="field">
          <label>From (Source)</label>
          <select name="source" required>
            {% for s in sources %}
            <option value="{{ s }}">{{ s }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="field">
          <label>To (Destination)</label>
          <select name="destination" required>
            {% for d in destinations %}
            <option value="{{ d }}" {% if d == 'Mumbai' %}selected{% endif %}>{{ d }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="field">
          <label>Date of Journey</label>
          <input type="date" name="journey_date" required
                 min="{{ today }}"
                 value="{{ default_date }}" />
        </div>
      </div>

      <div class="divider"></div>

      <!-- Times -->
      <div class="section-title">Timings</div>
      <div class="grid-2" style="margin-bottom:1.2rem">
        <div class="field">
          <label>Departure Time</label>
          <input type="time" name="dep_time" value="10:00" required />
        </div>
        <div class="field">
          <label>Arrival Time</label>
          <input type="time" name="arr_time" value="12:30" required />
        </div>
      </div>

      <div class="divider"></div>

      <!-- Airline & Stops -->
      <div class="section-title">Flight Details</div>
      <div class="field" style="margin-bottom:1.2rem">
        <label>Airline</label>
        <select name="airline" required>
          {% for a in airlines %}
          <option value="{{ a }}">{{ a }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="field" style="margin-bottom:1.5rem">
        <label>Total Stops</label>
        <div class="stops-group">
          <button type="button" class="stop-btn active" onclick="setStop(this,0)">Non-stop</button>
          <button type="button" class="stop-btn"        onclick="setStop(this,1)">1 Stop</button>
          <button type="button" class="stop-btn"        onclick="setStop(this,2)">2 Stops</button>
          <button type="button" class="stop-btn"        onclick="setStop(this,3)">3+ Stops</button>
        </div>
        <input type="hidden" name="total_stops" id="stops_val" value="0" />
      </div>

      <button class="btn-predict" type="submit">
        ✦ Predict Flight Price
      </button>

    </form>
  </div>
</div>

<script>
  // Set today as default date
  const today = new Date().toISOString().split('T')[0];
  const dateInput = document.querySelector('input[name="journey_date"]');
  if (dateInput) { dateInput.min = today; dateInput.value = today; }

  function setStop(el, val) {
    document.querySelectorAll('.stop-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('stops_val').value = val;
  }
</script>
</body>
</html>
