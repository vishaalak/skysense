
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); }
  .app { padding: 1.5rem 1rem; }
  .header { display: flex; align-items: center; gap: 10px; margin-bottom: 1.5rem; }
  .logo-icon { width: 40px; height: 40px; background: #185FA5; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; }
  .logo-text h1 { font-size: 22px; font-weight: 500; color: var(--color-text-primary); line-height: 1; }
  .logo-text p { font-size: 13px; color: var(--color-text-secondary); margin-top: 2px; }
  .card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1.25rem; margin-bottom: 1rem; }
  .section-label { font-size: 12px; font-weight: 500; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.75rem; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 13px; color: var(--color-text-secondary); }
  .field select, .field input { padding: 8px 10px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); font-size: 14px; background: var(--color-background-secondary); color: var(--color-text-primary); width: 100%; }
  .stops-row { display: flex; gap: 8px; margin-top: 4px; }
  .stop-btn { flex: 1; padding: 8px 4px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: var(--color-background-secondary); color: var(--color-text-secondary); font-size: 13px; cursor: pointer; transition: all 0.15s; }
  .stop-btn.active { background: #E6F1FB; color: #185FA5; border-color: #185FA5; font-weight: 500; }
  .predict-btn { width: 100%; padding: 12px; background: #185FA5; color: white; border: none; border-radius: var(--border-radius-md); font-size: 15px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.15s; }
  .predict-btn:hover { background: #0C447C; }
  .predict-btn:disabled { background: var(--color-background-secondary); color: var(--color-text-secondary); cursor: not-allowed; }
  .result-card { background: #E6F1FB; border: 0.5px solid #B5D4F4; border-radius: var(--border-radius-lg); padding: 1.25rem; margin-bottom: 1rem; }
  .result-price { font-size: 36px; font-weight: 500; color: #0C447C; }
  .result-label { font-size: 13px; color: #185FA5; margin-bottom: 4px; }
  .result-meta { font-size: 13px; color: #185FA5; margin-top: 6px; }
  .factors { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 0.75rem; }
  .factor { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 8px 10px; }
  .factor-name { font-size: 11px; color: var(--color-text-secondary); }
  .factor-bar-bg { height: 4px; background: var(--color-border-tertiary); border-radius: 2px; margin-top: 4px; }
  .factor-bar { height: 4px; background: #378ADD; border-radius: 2px; }
  .factor-val { font-size: 12px; color: var(--color-text-primary); font-weight: 500; margin-top: 2px; }
  .loader { display: none; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.4); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-msg { color: var(--color-text-danger); font-size: 13px; padding: 8px; background: var(--color-background-danger); border-radius: var(--border-radius-md); margin-top: 8px; }
  .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 20px; }
</style>

<div class="app">
  <h2 class="sr-only">SKYSENSE — Flight Price Prediction App</h2>
  <div class="header">
    <div class="logo-icon"><i class="ti ti-plane" aria-hidden="true"></i></div>
    <div class="logo-text">
      <h1>SKYSENSE</h1>
      <p>Flight price prediction</p>
    </div>
  </div>

  <div class="card">
    <div class="section-label">Route</div>
    <div class="grid-2" style="margin-bottom: 12px;">
      <div class="field">
        <label>From</label>
        <select id="source">
          <option>Delhi</option>
          <option>Mumbai</option>
          <option>Bangalore</option>
          <option>Kolkata</option>
          <option>Chennai</option>
          <option>Hyderabad</option>
        </select>
      </div>
      <div class="field">
        <label>To</label>
        <select id="destination">
          <option>Mumbai</option>
          <option>Delhi</option>
          <option>Bangalore</option>
          <option>Kolkata</option>
          <option>Chennai</option>
          <option>Hyderabad</option>
        </select>
      </div>
    </div>
    <div class="grid-2">
      <div class="field">
        <label>Departure</label>
        <input type="datetime-local" id="dep_time" value="2025-06-15T10:00">
      </div>
      <div class="field">
        <label>Arrival</label>
        <input type="datetime-local" id="arr_time" value="2025-06-15T12:30">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="section-label">Flight details</div>
    <div class="field" style="margin-bottom: 12px;">
      <label>Airline</label>
      <select id="airline">
        <option>Air India</option>
        <option>IndiGo</option>
        <option>SpiceJet</option>
        <option>Vistara</option>
        <option>GoAir</option>
        <option>Jet Airways</option>
        <option>Air Asia</option>
        <option>Multiple carriers</option>
      </select>
    </div>
    <div class="field">
      <label>Total stops</label>
      <div class="stops-row">
        <button class="stop-btn active" onclick="selectStop(this, 0)">Non-stop</button>
        <button class="stop-btn" onclick="selectStop(this, 1)">1 stop</button>
        <button class="stop-btn" onclick="selectStop(this, 2)">2 stops</button>
        <button class="stop-btn" onclick="selectStop(this, 3)">3+ stops</button>
      </div>
    </div>
  </div>

  <button class="predict-btn" onclick="predictPrice()" id="predict-btn">
    <i class="ti ti-sparkles" aria-hidden="true"></i>
    <span id="btn-text">Predict price</span>
    <div class="loader" id="loader"></div>
  </button>

  <div id="result-section" style="display:none;"></div>
</div>

<script>
  let selectedStops = 0;

  function selectStop(el, val) {
    document.querySelectorAll('.stop-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    selectedStops = val;
  }

  function getDuration() {
    const dep = new Date(document.getElementById('dep_time').value);
    const arr = new Date(document.getElementById('arr_time').value);
    let diff = (arr - dep) / 60000;
    if (diff <= 0) diff = 150;
    return diff;
  }

  function getDepHour() {
    const dep = new Date(document.getElementById('dep_time').value);
    return dep.getHours();
  }

  function estimatePrice() {
    const airline = document.getElementById('airline').value;
    const source = document.getElementById('source').value;
    const dest = document.getElementById('destination').value;
    const stops = selectedStops;
    const durationMin = getDuration();
    const depHour = getDepHour();

    const airlineFactor = { 'Jet Airways': 1.4, 'Air India': 1.25, 'Vistara': 1.2, 'IndiGo': 0.85, 'SpiceJet': 0.8, 'GoAir': 0.78, 'Air Asia': 0.75, 'Multiple carriers': 1.1 };
    const routeBase = { 'Delhi-Mumbai': 4200, 'Mumbai-Delhi': 4200, 'Delhi-Bangalore': 4800, 'Bangalore-Delhi': 4800, 'Delhi-Kolkata': 4100, 'Kolkata-Delhi': 4100, 'Mumbai-Bangalore': 3500, 'Bangalore-Mumbai': 3500, 'Chennai-Delhi': 5200, 'Delhi-Chennai': 5200, 'Hyderabad-Delhi': 4600, 'Delhi-Hyderabad': 4600 };

    const routeKey = `${source}-${dest}`;
    let base = routeBase[routeKey] || 4500;
    base *= (airlineFactor[airline] || 1.0);
    base += stops * 600;
    base += (durationMin / 60) * 150;
    const peakHourBonus = (depHour >= 6 && depHour <= 9) || (depHour >= 17 && depHour <= 20) ? 700 : 0;
    base += peakHourBonus;
    const noise = (Math.random() - 0.5) * 400;
    return Math.round(base + noise);
  }

  function getFactors(price) {
    const airline = document.getElementById('airline').value;
    const stops = selectedStops;
    const dur = getDuration();
    const depHour = getDepHour();
    const isPeak = (depHour >= 6 && depHour <= 9) || (depHour >= 17 && depHour <= 20);
    return [
      { name: 'Airline', val: airline, pct: Math.min(95, 40 + (price > 5000 ? 30 : 10)) },
      { name: 'Stops', val: stops === 0 ? 'Non-stop' : `${stops} stop${stops > 1 ? 's' : ''}`, pct: Math.min(95, 20 + stops * 25) },
      { name: 'Duration', val: `${Math.floor(dur/60)}h ${dur%60}m`, pct: Math.min(95, 30 + dur/10) },
      { name: 'Timing', val: isPeak ? 'Peak hours' : 'Off-peak', pct: isPeak ? 70 : 35 },
    ];
  }

  async function predictPrice() {
    const source = document.getElementById('source').value;
    const dest = document.getElementById('destination').value;
    if (source === dest) {
      document.getElementById('result-section').style.display = 'block';
      document.getElementById('result-section').innerHTML = '<div class="error-msg"><i class="ti ti-alert-circle"></i> Source and destination cannot be the same.</div>';
      return;
    }

    const btn = document.getElementById('predict-btn');
    const loader = document.getElementById('loader');
    const btnText = document.getElementById('btn-text');
    btn.disabled = true;
    loader.style.display = 'block';
    btnText.textContent = 'Predicting…';

    await new Promise(r => setTimeout(r, 1100));

    const price = estimatePrice();
    const factors = getFactors(price);
    const airline = document.getElementById('airline').value;
    const source2 = document.getElementById('source').value;
    const dest2 = document.getElementById('destination').value;
    const dur = getDuration();
    const durStr = `${Math.floor(dur/60)}h ${Math.floor(dur%60)}m`;

    let factorsHTML = factors.map(f => `
      <div class="factor">
        <div class="factor-name">${f.name}</div>
        <div class="factor-bar-bg"><div class="factor-bar" style="width:${f.pct}%"></div></div>
        <div class="factor-val">${f.val}</div>
      </div>
    `).join('');

    document.getElementById('result-section').innerHTML = `
      <div class="result-card">
        <div class="result-label">Estimated fare</div>
        <div class="result-price">₹${price.toLocaleString('en-IN')}</div>
        <div class="result-meta">${airline} · ${source2} → ${dest2} · ${durStr} · ${selectedStops === 0 ? 'Non-stop' : selectedStops + ' stop' + (selectedStops > 1 ? 's' : '')}</div>
      </div>
      <div class="card">
        <div class="section-label">Feature importance</div>
        <div class="factors">${factorsHTML}</div>
      </div>
    `;
    document.getElementById('result-section').style.display = 'block';

    btn.disabled = false;
    loader.style.display = 'none';
    btnText.textContent = 'Predict again';
  }
</script>
